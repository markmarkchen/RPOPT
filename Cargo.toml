[package]
name = "rpopt"
version = "0.1.0"
edition = "2024"
description = "Rust rewrite of PPOPT (multiparametric LP/QP/MILP/MIQP) with explicit-MPC point location methods"
license = "MIT"

[dependencies]
clarabel = "0.11.1"
mimalloc = { version = "0.1.52", default-features = false, optional = true }
nalgebra = "0.33"
rand = "0.8"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
lp_census = []
# Slow test tier: tests marked `cfg_attr(not(feature = "slow_tests"), ignore)` (minutes each on one core) are skipped
# by the merge gate and run before every push (`ci_build.sh <tag> full` on Negishi, or `--features slow_tests`).
slow_tests = []

[[example]]
name = "lp_census"
required-features = ["lp_census"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# Test and correctness runs: release optimisation without fat LTO, so a build links in parallel and
# rebuilds incrementally. Rust never reorders or fuses float arithmetic, so results do not depend
# on LTO. Timing and benchmarks keep the release profile.
#   cargo test --profile gate
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
