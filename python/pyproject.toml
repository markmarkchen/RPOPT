[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "rpopt"
version = "0.1.0"
description = "RPOPT: a Rust port of PPOPT (multiparametric programming) with a PPOPT-compatible Python API"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.maturin]
python-source = "."
module-name = "rpopt._rpopt"
manifest-path = "Cargo.toml"
