[package]
name = "rpopt-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for RPOPT with a PPOPT-compatible API"
license = "MIT"

[lib]
name = "_rpopt"
crate-type = ["cdylib"]

[dependencies]
rpopt = { path = "..", default-features = false }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py39", "multiple-pymethods"] }
numpy = "0.26"
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
